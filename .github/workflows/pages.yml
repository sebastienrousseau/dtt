# Builds the API documentation served at https://doc.dttlib.com and
# deploys it to GitHub Pages with GitHub Actions (AGENTS.md section
# 7.1.3).
#
# tools/docs-site.sh runs `cargo doc --no-deps` for this crate only,
# then adds robots.txt, sitemap.xml and canonical links, and checks
# them. Pull requests build and check the site; only a push to main (or
# a manual run on main) deploys it.
#
# This replaces two deployers: the shared docs job in ci.yml, which
# published rustdoc with no robots.txt, sitemap or canonical links, and
# an upload of the gh-pages branch, which holds a 2024 build with items
# since removed (dtt_create_vec!). The gh-pages branch is no longer
# read; deleting it is left to the maintainer.
#
# The custom domain is kept in the repository's Pages settings (cname),
# which a workflow deployment uses, so no CNAME file is written.

name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Nightly, as docs.rs uses: `--cfg docsrs` enables `doc_cfg`.
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - name: Build and check the site
        env:
          RUSTUP_TOOLCHAIN: nightly
        run: tools/docs-site.sh
      - name: Show robots.txt and sitemap size
        run: |
          cat target/doc/robots.txt
          grep -c '<loc>' target/doc/sitemap.xml
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/doc

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
