# -----------------------------------------------------------------------------
# DateTime (DTT) - A Rust library for parsing, validating, manipulating, and
# formatting dates and times.
# -----------------------------------------------------------------------------

[package]
name = "dtt"
version = "0.0.10"
edition = "2021"
rust-version = "1.88.0"
license = "MIT OR Apache-2.0"
authors = ["The DateTime (DTT) contributors"]
build = "build.rs"
description = """
    A Rust library for parsing, validating, manipulating, and formatting dates
    and times.
"""
homepage = "https://dttlib.com/"
documentation = "https://docs.rs/dtt"
repository = "https://github.com/sebastienrousseau/dtt.git"
readme = "README.md"

# -----------------------------------------------------------------------------
# Crate Configuration
# -----------------------------------------------------------------------------
categories = ["date-and-time", "parser-implementations", "value-formatting"]
keywords = ["dtt", "date", "datetime", "time", "timezone"]
exclude = ["/.git/*", "/.github/*", "/.gitignore", "/.vscode/*"]

# Included and excluded files.
include = [
    "/CONTRIBUTING.md",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/benches/**",
    "/build.rs",
    "/Cargo.toml",
    "/examples/**",
    "/README.md",
    "/src/**",
    "/tests/**",
]

# -----------------------------------------------------------------------------
# Library Configuration
# -----------------------------------------------------------------------------
[lib]
crate-type = ["lib"]
name = "dtt"
path = "src/lib.rs"

# -----------------------------------------------------------------------------
# Benchmarks
# -----------------------------------------------------------------------------
[[bench]]
name = "benchmark"
path = "benches/criterion.rs"
harness = false

# -----------------------------------------------------------------------------
# Examples
# -----------------------------------------------------------------------------
# The `dtt` example exercises serde round-tripping; it can only build when
# the `serde` feature is enabled. The other examples are feature-free.
[[example]]
name = "dtt"
path = "examples/dtt.rs"
required-features = ["serde"]

[profile.bench]
debug = true

# -----------------------------------------------------------------------------
# Dependencies
# -----------------------------------------------------------------------------
[dependencies]
# `pastey` is the maintained fork of the now-unmaintained `paste` crate
# (RUSTSEC-2024-0436). Drop-in compatible.
pastey = "0.2.1"
# serde is opt-in via the `serde` feature (enabled by default). Disable
# default-features to drop ~6 transitive dependencies.
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0.140", optional = true }
# 0.3.47 fixes RUSTSEC time stack-exhaustion DoS (medium severity).
# `time`'s `serde` feature is only needed when our `serde` feature is on.
time = { version = "0.3.47", default-features = false, features = ["formatting", "parsing"] }
thiserror = "2.0.18"

# -----------------------------------------------------------------------------
# Dev-Dependencies
# -----------------------------------------------------------------------------
[dev-dependencies]
assert_cmd = "2.2.0"
criterion = "0.8.2"
proptest = "1.5.0"
regex = "1.12.3"
serde_json = "1.0.140"
serial_test = "3.2.0"

# -----------------------------------------------------------------------------
# Build Dependencies
# -----------------------------------------------------------------------------
[build-dependencies]
version_check = "0.9.5"

# -----------------------------------------------------------------------------
# Features
# -----------------------------------------------------------------------------
[features]
# Default keeps the v0.0.9 behaviour (serde on, RFC 3339 round-trip).
default = ["serde"]
# Optional `serde`/`serde_json` support. Drops ~6 transitive crates when off.
serde = ["dep:serde", "dep:serde_json", "time/serde"]
bench = []

# -----------------------------------------------------------------------------
# Documentation Configuration
# -----------------------------------------------------------------------------

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]

# -----------------------------------------------------------------------------
# Linting config
# -----------------------------------------------------------------------------

[lints.rust]
missing_copy_implementations = "warn"
missing_docs = "warn"
unstable_features = "warn"
unused_extern_crates = "warn"
unused_results = "warn"

bare_trait_objects = "allow"
elided_lifetimes_in_paths = "allow"
non_camel_case_types = "allow"
non_upper_case_globals = "allow"
trivial_bounds = "allow"
unsafe_code = "forbid"

missing_debug_implementations = "forbid"
non_ascii_idents = "forbid"
unreachable_pub = "forbid"

dead_code = "deny"
deprecated_in_future = "deny"
ellipsis_inclusive_range_patterns = "deny"
explicit_outlives_requirements = "deny"
future_incompatible = { level = "deny", priority = -1 }
keyword_idents = { level = "deny", priority = -1 }
macro_use_extern_crate = "deny"
meta_variable_misuse = "deny"
noop_method_call = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2021_compatibility = { level = "deny", priority = -1 }
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unused = { level = "deny", priority = -1 }
unused_features = "deny"
unused_import_braces = "deny"
unused_labels = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
unused_qualifications = "deny"
variant_size_differences = "deny"

# Cargo-managed clippy enforcement applies to ALL targets in the package
# (lib, bin, tests, benches, examples). Keep only universal allowances
# here; library-only strict lints (`pedantic`, `nursery`, `cargo`,
# `unwrap_used`, etc.) live as inner `#![deny(...)]` attributes in
# `src/lib.rs` so they don't fire on tests that legitimately use unwrap.
[lints.clippy]
module_name_repetitions = "allow"
# `multiple_crate_versions` fires on dev-deps the user can't control
# (criterion brings in older itertools etc.).
multiple_crate_versions = "allow"

[profile.dev]
codegen-units = 256
debug = true
debug-assertions = true
incremental = true
lto = false
opt-level = 0
overflow-checks = true
panic = 'unwind'
rpath = false
strip = false

[profile.release]
codegen-units = 1
debug = false
debug-assertions = false
incremental = false
lto = true
opt-level = 3
overflow-checks = false
panic = "abort"
rpath = false
strip = "symbols"

[profile.test]
codegen-units = 256
debug = true
debug-assertions = true
incremental = true
lto = false
opt-level = 0
overflow-checks = true
rpath = false
strip = false
