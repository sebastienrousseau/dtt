# cargo-deny configuration (schema v2)
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

# -----------------------------------------------------------------------------
# License policy
# -----------------------------------------------------------------------------
[licenses]
# Confidence threshold for license text matching (0.0..=1.0).
confidence-threshold = 0.8

# Explicitly allowed SPDX identifiers.
allow = [
    "Apache-2.0",
    "MIT",
    "CC0-1.0",
    "ISC",
    "0BSD",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unlicense",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
]

# -----------------------------------------------------------------------------
# Dependency bans
# -----------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

# Crates whose presence should fail the build. Each entry is a name and an
# optional version range.
deny = []

# Crates that are intentionally allowed even when they would otherwise be
# flagged. Use with care.
allow = []

# Crates skipped during duplicate-version detection.
skip = []
skip-tree = []

# -----------------------------------------------------------------------------
# Security advisories (RustSec)
# -----------------------------------------------------------------------------
[advisories]
yanked = "deny"
ignore = []

# -----------------------------------------------------------------------------
# Source registries
# -----------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
